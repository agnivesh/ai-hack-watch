name: Generate site data
on:
  push:
    paths: ["data.md", "scripts/**", ".github/workflows/update-site.yml"]
  schedule:
    - cron: "17 3 * * *"   # keep the days-since badge fresh daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archive sources and generate feeds
        run: python3 scripts/generate.py
      - name: Pre-render the recent timeline
        run: python3 scripts/prerender_timeline.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.md incidents.json feed.xml days-since-badge.svg index.html
          git diff --cached --quiet || git commit -m "Update generated data and archive links"
          git push