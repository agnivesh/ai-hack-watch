name: Check source links
on:
  schedule: [{cron: '23 4 * * 1'}]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check URLs
        run: python3 scripts/check_links.py
      - name: Create or update issue
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          if [ ! -s /tmp/failures.txt ]; then exit 0; fi
          { echo "The weekly source-link check found URLs that may be unavailable. Some sites block automated requests; verify manually before changing the dataset."; echo; cat /tmp/failures.txt; } > /tmp/issue-body.txt
          EXISTING=$(gh issue list --state open --search "Broken source links in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body-file /tmp/issue-body.txt; else gh issue create --title "Broken source links" --body-file /tmp/issue-body.txt; fi