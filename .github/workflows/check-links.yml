name: Check source links
on:
  schedule: [{cron: '23 4 * * 1'}]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check URLs
        shell: python
        run: |
          import json,urllib.request
          from pathlib import Path
          failures=[]; incidents=json.loads(Path('incidents.json').read_text())
          for a in incidents:
            try:
              req=urllib.request.Request(a['url'],headers={'User-Agent':'ai-hack-watch-link-checker/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                if r.status>=400: failures.append((r.status,a['title'],a['url']))
            except Exception as e: failures.append(('unreachable',a['title'],a['url']))
          Path('/tmp/failures.txt').write_text('\n'.join(f'{s} | {t} | {u}' for s,t,u in failures))
          print(f'Checked {len(incidents)} links; {len(failures)} failed.')
      - name: Create or update issue
        env: {GH_TOKEN: ${{ github.token }}}
        shell: bash
        run: |
          if [ ! -s /tmp/failures.txt ]; then exit 0; fi
          BODY="The weekly source-link check found URLs that may be unavailable. Some sites block automated requests; verify manually before changing the dataset.\n\n$(cat /tmp/failures.txt)"
          EXISTING=$(gh issue list --state open --search "Broken source links in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "Broken source links" --body "$BODY"; fi
