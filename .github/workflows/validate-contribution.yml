name: Validate contribution
on:
  pull_request:
    paths: [data.md, scripts/**, .github/ISSUE_TEMPLATE/**, .github/PULL_REQUEST_TEMPLATE.md]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate data and detect duplicates
        run: python3 scripts/validate_contribution.py